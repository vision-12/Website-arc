# Extends gitleaks' default rules. Only exact, documented placeholder values are allow-listed:
# Supabase *publishable* keys are public by design, and these two are dummies used in CI and .env.example.
# The ci-placeholder-* values are dummy app secrets for the CI "checks" job, which only validates env shape.
[extend]
useDefault = true

[allowlist]
description = "Non-secret placeholders"
regexes = [
  '''sb_publishable_ci_placeholder''',
  '''sb_publishable_replace_me''',
  '''ci-placeholder-cron-secret-0123456789abcdef''',
  '''ci-placeholder-form-secret-0123456789abcdef''',
  '''ci-placeholder-ip-salt-0123456789abcdef''',
  '''ci-placeholder-preview-secret-0123456789abcdef''',
]
