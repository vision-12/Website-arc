# Extends gitleaks' default rules. Only exact, documented placeholder values are allow-listed:
# Supabase *publishable* keys are public by design, and these two are dummies used in CI and .env.example.
[extend]
useDefault = true

[allowlist]
description = "Non-secret placeholders"
regexes = [
  '''sb_publishable_ci_placeholder''',
  '''sb_publishable_replace_me''',
]
