<!-- Local development template. Production templates are set at provisioning (spec §7.2 step 3)
     and branded per school. The link uses token_hash so it works on any device (no PKCE verifier). -->
<h2>You have been invited to help manage the school website</h2>
<p>Someone at your school has invited you to the website administration area.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/accept-invite"
    >Accept the invitation and choose a password</a
  >
</p>
<p>
  This link can be used once and expires in 24 hours. If you were not expecting this email, you can
  ignore it.
</p>
